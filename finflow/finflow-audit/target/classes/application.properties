# ============================================================
# FinFlow Audit Service - Configuracion Principal
# ============================================================

server.port=8084

spring.application.name=finflow-audit

# Datasource - PostgreSQL (usar variables de entorno en produccion)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/finflow_audit}
spring.datasource.username=${DATABASE_USER:finflow}
spring.datasource.password=${DATABASE_PASSWORD:finflow123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ============================================================
# Kafka Configuration
# ============================================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=finflow-audit-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=ec.com.finflow.audit.kafka.AuditEvent
spring.kafka.listener.ack-mode=MANUAL_IMMEDIATE
spring.kafka.listener.concurrency=3

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ============================================================
# Logging
# ============================================================
logging.level.root=INFO
logging.level.ec.com.finflow=DEBUG
logging.level.org.springframework.kafka=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ============================================================
# Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized

# ============================================================
# FinFlow Audit Configuration
# ============================================================
finflow.audit.topics.transfers-initiated=finflow.transfers.initiated
finflow.audit.topics.transfers-completed=finflow.transfers.completed
finflow.audit.topics.transfers-failed=finflow.transfers.failed
finflow.audit.topics.transfers-reversed=finflow.transfers.reversed
finflow.audit.topics.accounts-blocked=finflow.accounts.blocked
finflow.audit.topics.accounts-debited=finflow.accounts.debited
finflow.audit.topics.accounts-credited=finflow.accounts.credited
finflow.audit.retention.days=365
