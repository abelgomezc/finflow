# ============================================================
# FinFlow Accounts Service - Configuracion Principal
# ============================================================

server.port=8081

spring.application.name=finflow-accounts

# Virtual Threads (Java 21)
spring.threads.virtual.enabled=true

# Datasource - PostgreSQL (usar variables de entorno en produccion)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/finflow_accounts}
spring.datasource.username=${DATABASE_USER:finflow}
spring.datasource.password=${DATABASE_PASSWORD:finflow123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=FinFlowAccountsPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=60000
spring.flyway.schemas=public
spring.flyway.default-schema=public

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ============================================================
# gRPC Server Configuration (deshabilitado temporalmente)
# ============================================================
grpc.server.port=9081
grpc.server.enable-keep-alive=true
grpc.server.keep-alive-time=30s
grpc.server.keep-alive-timeout=5s
grpc.server.permit-keep-alive-without-calls=true
grpc.server.max-inbound-message-size=4194304

# ============================================================
# Logging
# ============================================================
logging.level.root=INFO
logging.level.ec.com.finflow=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.net.devh.boot.grpc=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n

# ============================================================
# Actuator / Health Checks
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.health.db.enabled=true

# ============================================================
# Application Custom Properties
# ============================================================
finflow.accounts.default-daily-limit=10000.00
finflow.accounts.default-per-transfer-limit=5000.00
finflow.accounts.block-expiration-minutes=15
finflow.accounts.max-blocks-per-account=10
finflow.accounts.idempotency-cache-minutes=60
