# ============================================================
# FinFlow Transfers Service - Configuracion Principal
# Orquestador central del patron Saga
# ============================================================

server.port=8082

spring.application.name=finflow-transfers
spring.threads.virtual.enabled=true

# Datasource - PostgreSQL (usar variables de entorno en produccion)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/finflow_transfers}
spring.datasource.username=${DATABASE_USER:finflow}
spring.datasource.password=${DATABASE_PASSWORD:finflow123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=FinFlowTransfersPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ============================================================
# Kafka Configuration (disabled - Kafka not available)
# ============================================================
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=1

# Consumer
spring.kafka.consumer.group-id=finflow-transfers
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=ec.com.finflow.*

# ============================================================
# gRPC Clients Configuration (deshabilitado temporalmente)
# ============================================================
grpc.client.finflow-accounts.address=static://localhost:9081
grpc.client.finflow-accounts.negotiation-type=plaintext
grpc.client.finflow-accounts.enable-keep-alive=true
grpc.client.finflow-accounts.keep-alive-time=30s

grpc.client.finflow-validation.address=static://localhost:9083
grpc.client.finflow-validation.negotiation-type=plaintext
grpc.client.finflow-validation.enable-keep-alive=true
grpc.client.finflow-validation.keep-alive-time=30s

# ============================================================
# HTTP Service URLs (for REST-based communication)
# ============================================================
finflow.services.accounts.url=${ACCOUNTS_SERVICE_URL:http://localhost:8081}

# ============================================================
# Logging
# ============================================================
logging.level.root=INFO
logging.level.ec.com.finflow=DEBUG
logging.level.org.springframework.kafka=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n

# ============================================================
# Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# ============================================================
# Transfer Configuration
# ============================================================
# Topics de Kafka
finflow.transfers.topics.initiated=finflow.transfers.initiated
finflow.transfers.topics.completed=finflow.transfers.completed
finflow.transfers.topics.failed=finflow.transfers.failed
finflow.transfers.topics.reversed=finflow.transfers.reversed

# Tiempo de expiracion de bloqueo (minutos)
finflow.transfers.block-expiration-minutes=15

# Reintentos para operaciones gRPC
finflow.transfers.grpc-retry-attempts=3
finflow.transfers.grpc-retry-delay-ms=1000
