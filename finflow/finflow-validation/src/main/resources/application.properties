# ============================================================
# FinFlow Validation Service - Configuracion Principal
# Motor de validacion y anti-fraude
# ============================================================

server.port=8083

spring.application.name=finflow-validation
spring.threads.virtual.enabled=true

# Datasource - PostgreSQL (usar variables de entorno en produccion)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/finflow_validation}
spring.datasource.username=${DATABASE_USER:finflow}
spring.datasource.password=${DATABASE_PASSWORD:finflow123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=FinFlowValidationPool
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ============================================================
# gRPC Configuration (deshabilitado temporalmente)
# ============================================================
grpc.server.port=9083
grpc.server.enable-keep-alive=true
grpc.server.keep-alive-time=30s
grpc.server.keep-alive-timeout=5s
grpc.server.max-inbound-message-size=4194304

# Cliente gRPC para conectar a finflow-accounts
grpc.client.finflow-accounts.address=static://localhost:9081
grpc.client.finflow-accounts.negotiation-type=plaintext
grpc.client.finflow-accounts.enable-keep-alive=true
grpc.client.finflow-accounts.keep-alive-time=30s

# ============================================================
# Logging
# ============================================================
logging.level.root=INFO
logging.level.ec.com.finflow=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n

# ============================================================
# Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# ============================================================
# Fraud Detection Configuration
# ============================================================
# Umbral de fraud score para rechazar (0-100)
finflow.validation.fraud-score-threshold=70

# Reglas de limites por defecto
finflow.validation.default-max-amount-per-transfer=5000.00
finflow.validation.default-max-daily-amount=10000.00
finflow.validation.default-max-transfers-per-hour=10

# Horas consideradas "inusuales" (mayor riesgo)
finflow.validation.suspicious-hours-start=2
finflow.validation.suspicious-hours-end=5

# Multiplicador para detectar montos anomalos
finflow.validation.amount-anomaly-multiplier=3.0

# Score por indicador de fraude
finflow.validation.score-weights.unusual-amount=40
finflow.validation.score-weights.unusual-hour=20
finflow.validation.score-weights.first-time-recipient=10
finflow.validation.score-weights.rapid-succession=15
finflow.validation.score-weights.blacklisted-recipient=100
