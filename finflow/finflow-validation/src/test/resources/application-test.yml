# ============================================================
# FinFlow Validation - Configuración para Tests
# ============================================================

spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

grpc:
  server:
    port: 0

logging:
  level:
    root: WARN
    ec.com.finflow: DEBUG

finflow:
  validation:
    fraud-score-threshold: 70
    default-max-amount-per-transfer: 5000.00
    default-max-daily-amount: 10000.00
