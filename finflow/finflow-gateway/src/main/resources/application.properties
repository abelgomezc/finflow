# ============================================================
# FinFlow API Gateway - Configuracion Principal
# ============================================================

server.port=8080

spring.application.name=finflow-gateway

# ============================================================
# Spring Cloud Gateway - Default Filters
# ============================================================
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# ============================================================
# Spring Cloud Gateway - Routes
# ============================================================

# Accounts Service
spring.cloud.gateway.routes[0].id=accounts-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/accounts/**
spring.cloud.gateway.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[0].filters[0].args.name=accountsCircuitBreaker
spring.cloud.gateway.routes[0].filters[0].args.fallbackUri=forward:/fallback/accounts
spring.cloud.gateway.routes[0].filters[1]=AddRequestHeader=X-Gateway-Request-Id, ${random.uuid}

# Transfers Service
spring.cloud.gateway.routes[1].id=transfers-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/transfers/**
spring.cloud.gateway.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[1].filters[0].args.name=transfersCircuitBreaker
spring.cloud.gateway.routes[1].filters[0].args.fallbackUri=forward:/fallback/transfers
spring.cloud.gateway.routes[1].filters[1]=AddRequestHeader=X-Gateway-Request-Id, ${random.uuid}

# Audit Service
spring.cloud.gateway.routes[2].id=audit-service
spring.cloud.gateway.routes[2].uri=http://localhost:8084
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/audit/**
spring.cloud.gateway.routes[2].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[2].filters[0].args.name=auditCircuitBreaker
spring.cloud.gateway.routes[2].filters[0].args.fallbackUri=forward:/fallback/audit
spring.cloud.gateway.routes[2].filters[1]=AddRequestHeader=X-Gateway-Request-Id, ${random.uuid}

# Notifications Service
spring.cloud.gateway.routes[3].id=notifications-service
spring.cloud.gateway.routes[3].uri=http://localhost:8085
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/notifications/**
spring.cloud.gateway.routes[3].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[3].filters[0].args.name=notificationsCircuitBreaker
spring.cloud.gateway.routes[3].filters[0].args.fallbackUri=forward:/fallback/notifications
spring.cloud.gateway.routes[3].filters[1]=AddRequestHeader=X-Gateway-Request-Id, ${random.uuid}

# Users Service (Profile)
spring.cloud.gateway.routes[4].id=users-service
spring.cloud.gateway.routes[4].uri=http://localhost:8081
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/users/**
spring.cloud.gateway.routes[4].filters[0]=AddRequestHeader=X-Gateway-Request-Id, ${random.uuid}

# Static Files (Profile Photos)
spring.cloud.gateway.routes[5].id=uploads-service
spring.cloud.gateway.routes[5].uri=http://localhost:8081
spring.cloud.gateway.routes[5].predicates[0]=Path=/uploads/**

# Admin - Stats (finflow-accounts) - debe estar antes de usuarios
spring.cloud.gateway.routes[6].id=admin-stats-service
spring.cloud.gateway.routes[6].uri=http://localhost:8081
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/v1/admin/stats
spring.cloud.gateway.routes[6].filters[0]=AddRequestHeader=X-Gateway-Request-Id, ${random.uuid}

# Admin - Users (finflow-accounts)
spring.cloud.gateway.routes[7].id=admin-users-service
spring.cloud.gateway.routes[7].uri=http://localhost:8081
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/v1/admin/users/**
spring.cloud.gateway.routes[7].filters[0]=AddRequestHeader=X-Gateway-Request-Id, ${random.uuid}

# Admin - Transfers (finflow-transfers)
spring.cloud.gateway.routes[8].id=admin-transfers-service
spring.cloud.gateway.routes[8].uri=http://localhost:8082
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/v1/admin/transfers/**
spring.cloud.gateway.routes[8].filters[0]=AddRequestHeader=X-Gateway-Request-Id, ${random.uuid}

# Admin - Accounts (finflow-accounts) - Gestion de saldos
spring.cloud.gateway.routes[9].id=admin-accounts-service
spring.cloud.gateway.routes[9].uri=http://localhost:8081
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/v1/admin/accounts/**
spring.cloud.gateway.routes[9].filters[0]=AddRequestHeader=X-Gateway-Request-Id, ${random.uuid}

# ============================================================
# CORS Configuration
# ============================================================
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins[0]=http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins[1]=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[0]=GET
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[1]=POST
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[2]=PUT
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[3]=DELETE
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[4]=OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders[0]=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposedHeaders[0]=X-Correlation-ID
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposedHeaders[1]=X-Request-Id
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=3600

# ============================================================
# Logging
# ============================================================
logging.level.root=INFO
logging.level.ec.com.finflow=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web.cors=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ============================================================
# Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus,gateway
management.endpoint.health.show-details=when_authorized
management.endpoint.gateway.enabled=true

# ============================================================
# Resilience4j Circuit Breaker - Default Config
# ============================================================
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10s
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.eventConsumerBufferSize=10

# Circuit Breaker Instances
resilience4j.circuitbreaker.instances.accountsCircuitBreaker.baseConfig=default
resilience4j.circuitbreaker.instances.transfersCircuitBreaker.baseConfig=default
resilience4j.circuitbreaker.instances.auditCircuitBreaker.baseConfig=default
resilience4j.circuitbreaker.instances.notificationsCircuitBreaker.baseConfig=default

# Time Limiter
resilience4j.timelimiter.configs.default.timeoutDuration=10s

# ============================================================
# FinFlow Gateway Configuration
# ============================================================

# JWT Configuration - USAR VARIABLES DE ENTORNO EN PRODUCCION
finflow.gateway.jwt.secret=${JWT_SECRET:finflow-super-secret-key-for-jwt-authentication-minimum-256-bits-dev-only}
finflow.gateway.jwt.expiration=${JWT_EXPIRATION:3600000}
finflow.gateway.jwt.issuer=finflow-gateway

# Security - SOLO auth, health y uploads son publicos, todo lo demas requiere JWT
finflow.gateway.security.public-paths=/api/v1/auth/**,/actuator/health,/fallback/**,/uploads/**

# URLs de servicios internos
finflow.services.accounts.url=${ACCOUNTS_SERVICE_URL:http://localhost:8081}

# ============================================================
# Rate Limiting (en memoria - para produccion usar Redis)
# ============================================================
finflow.gateway.ratelimit.enabled=true
finflow.gateway.ratelimit.requests-per-second=10
finflow.gateway.ratelimit.burst-capacity=20
